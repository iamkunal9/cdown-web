<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Main content -->
  <text x="600" y="200" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="80" font-weight="bold">
    cdown
  </text>
  
  <text x="600" y="280" text-anchor="middle" fill="#a1a1aa" font-family="sans-serif" font-size="32">
    Smart Contract Downloader
  </text>
  
  <text x="600" y="350" text-anchor="middle" fill="#71717a" font-family="sans-serif" font-size="24">
    Download smart contract source code from multiple blockchain networks
  </text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="60" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="1000" cy="480" r="80" fill="#06b6d4" opacity="0.2"/>
  
  <!-- Footer -->
  <text x="600" y="580" text-anchor="middle" fill="#52525b" font-family="sans-serif" font-size="18">
    made with ❤️ by iamkunal9
  </text>
</svg>
